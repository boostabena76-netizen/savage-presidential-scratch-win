<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Savage Presidential Admin</title><style>body{font-family:Arial;margin:0;background:#111;color:#fff;padding:20px}.box{max-width:1000px;margin:auto;background:#1d1d1d;padding:20px;border-radius:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#292929;padding:16px;border-radius:12px}input,button{padding:11px;margin:5px;border-radius:8px;border:0}button{font-weight:700;cursor:pointer}.danger{background:#b22;color:#fff}.ok{background:#287a3d;color:#fff}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:9px;border-bottom:1px solid #444;text-align:left}</style></head><body><div class="box"><h1>Savage Presidential Admin</h1><div id="login"><input id="u" placeholder="Admin username"><input id="p" type="password" placeholder="Admin password"><button onclick="login()">Login</button></div><div id="app" style="display:none"><div class="grid" id="stats"></div><h2>Withdrawals</h2><table><thead><tr><th>ID</th><th>User</th><th>Amount</th><th>Bank</th><th>Account</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><h2>Prize settings</h2><table><thead><tr><th>Name</th><th>Amount (kobo)</th><th>Weight</th><th>Active</th><th></th></tr></thead><tbody id="prizes"></tbody></table></div></div><script>
async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let j=await r.json();if(!r.ok)return alert(j.error);document.getElementById('login').style.display='none';app.style.display='block';load()}
async function load(){let s=await (await fetch('/api/admin/stats')).json();stats.innerHTML=`<div class=stat>Users: ${s.users}</div><div class=stat>Cards: ${s.cards}</div><div class=stat>Pending: ${s.pending}</div><div class=stat>Pending cash: ${s.pending_amount}</div>`;let w=await (await fetch('/api/admin/withdrawals')).json();rows.innerHTML=w.map(x=>`<tr><td>${x.id}</td><td>${x.name}<br>${x.phone}</td><td>${x.amount}</td><td>${x.bank_name}</td><td>${x.account_name}<br>${x.account_number}</td><td>${x.status}</td><td>${x.status==='pending'?`<button class=ok onclick="act(${x.id},'pay')">Mark paid</button><button class=danger onclick="act(${x.id},'reject')">Reject</button>`:''}</td></tr>`).join('');let ps=await (await fetch('/api/admin/prizes')).json();prizes.innerHTML=ps.map(x=>`<tr><td><input id=n${x.id} value="${x.name}"></td><td><input id=a${x.id} value="${x.amount_kobo}"></td><td><input id=w${x.id} value="${x.weight}"></td><td><input id=ac${x.id} type=checkbox ${x.active?'checked':''}></td><td><button onclick="save(${x.id})">Save</button></td></tr>`).join('')}
async function act(id,a){await fetch('/api/admin/withdrawals/'+id+'/'+a,{method:'POST'});load()}async function save(id){await fetch('/api/admin/prizes/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('n'+id).value,amount_kobo:Number(document.getElementById('a'+id).value),weight:Number(document.getElementById('w'+id).value),active:document.getElementById('ac'+id).checked})});load()}
</script></body></html>
